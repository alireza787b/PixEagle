schema_version: 1
name: gimbal-vector-vertical-moving-target
rate_hz: 20
frame: local_ned
mount_type: VERTICAL
follower:
  profile: gm_velocity_vector
  requested_speed: 6.0
  altitude_control: true
constraints:
  velocity:
    forward: 6.0
    right: 4.0
    down: 4.0
  rate:
    yaw: 45.0
  altitude:
    min: 5.0
    max: 120.0
continuity_policy:
  mode: bounded_decay
  max_coast_time_s: 8.0
  max_coast_distance_m: 4.0
target:
  waypoints:
    - time_s: 0.0
      position_ned: [20.0, 0.0, -8.0]
    - time_s: 3.0
      position_ned: [18.0, 8.0, -5.0]
    - time_s: 6.0
      position_ned: [14.0, 0.0, 3.0]
    - time_s: 9.0
      position_ned: [20.0, -12.0, -4.0]
faults:
  - at_s: 4.0
    kind: delayed_observation
    duration_s: 0.4
  - at_s: 7.0
    kind: retarget
    target_waypoint_index: 3
expectations:
  - vertical guidance produces pure climb or descent near the down ray
  - command intent is compared with configured limits without predicting PX4 pose
  - stale intervals remain visibly unknown
