schema_version: 1
followers:
  - profile: mc_velocity_chase
    input: image_position_2d
    command: velocity_body_offboard
    purpose: Forward pursuit with a fixed or local camera
    behavior: Forward velocity ramps toward its configured ceiling; lateral error uses coordinated turn or sideslip.
    report: camera-chase-2d/report/index.html
    evidence: synthetic_replay
  - profile: mc_velocity_ground
    input: image_position_2d
    command: velocity_body_offboard
    purpose: Down-looking or oblique ground tracking
    behavior: Image horizontal error drives body-right; image vertical error drives body-forward; optional descent is safety limited.
  - profile: mc_velocity_distance
    input: image_position_2d
    command: velocity_body_offboard
    purpose: Visual centering without range pursuit
    behavior: Forward velocity stays zero; body-right, optional body-down, and optional yaw center the image target.
  - profile: mc_velocity_position
    input: image_position_2d
    command: velocity_body_offboard
    purpose: Stationary surveillance and operator-style tracking
    behavior: Forward and body-right translation stay zero; yaw and optional altitude follow the image target.
    report: camera-position-2d/report/index.html
    evidence: synthetic_replay
  - profile: mc_attitude_rate
    input: attitude_rate_image_position
    command: attitude_rate
    purpose: Multicopter high-authority visual control
    behavior: Image error becomes bounded roll, pitch, yaw-rate, and thrust intent; vehicle response remains separate evidence.
  - profile: fw_attitude_rate
    input: attitude_rate_image_position
    command: attitude_rate
    purpose: Fixed-wing visual pursuit
    behavior: Image guidance feeds attitude-rate/L1-TECS intent and requires airframe state such as groundspeed or airspeed when available.
  - profile: gm_velocity_chase
    input: gimbal_angles
    command: gimbal_velocity_body
    purpose: Gimbal-angle velocity chase
    behavior: Fresh mount-normalized gimbal angles become body-FRD velocity and yaw intent; no target range is inferred.
    report: horizontal/index.html
    evidence: synthetic_replay
  - profile: gm_velocity_vector
    input: gimbal_angles
    command: gimbal_velocity_body
    purpose: Full 3D gimbal line-of-sight pursuit
    behavior: A mount-normalized body ray supplies the 3D direction; requested speed sets magnitude while safety limits remain authoritative.
    report: combined/report/index.html
    evidence: synthetic_replay
