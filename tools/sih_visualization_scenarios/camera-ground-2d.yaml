schema_version: 1
name: local-camera-mc-velocity-ground-2d
rate_hz: 20
frame: local_ned
mount_type: HORIZONTAL
airframe: multicopter
evidence_provenance: synthetic_fixture
stable_flight: {required: true, settle_samples: 7}
initial_conditions:
  vehicle_ned: [0.0, 0.0, -20.0]
follower:
  profile: mc_velocity_ground
  purpose: 2D ground-view image tracking
  input_contract: image_position_2d
  command_contract: velocity_body_offboard
  speed_source_policy: none
  altitude_control: false
  requested_speed: null
constraints:
  velocity: {forward: 3.0, right: 2.0, down: 0.0}
  rate: {yaw: 35.0}
  altitude: {min: 5.0, max: 120.0}
continuity_policy: {mode: bounded_decay, max_coast_time_s: 8.0, max_coast_distance_m: 4.0}
target:
  waypoints:
    - {time_s: 0.0, position_ned: [12.0, 4.0, -20.0]}
    - {time_s: 4.0, position_ned: [12.0, 8.0, -20.0]}
    - {time_s: 8.0, position_ned: [15.0, 8.0, -20.0]}
    - {time_s: 12.0, position_ned: [15.0, 4.0, -20.0]}
faults:
  - {at_s: 5.0, kind: target_loss, duration_s: 0.6}
expectations:
  - image horizontal error maps to body-right intent
  - image vertical error maps to body-forward intent
  - altitude-disabled guidance keeps body-down at zero
acceptance:
  - no gimbal angle input or Vector session-speed control is used
