schema_version: 1
name: local-camera-chase-baseline
rate_hz: 20
frame: local_ned
mount_type: HORIZONTAL
follower:
  profile: mc_velocity_chase
  input_contract: image_position_2d
  command_contract: velocity_body_offboard
  requested_speed: null
  altitude_control: false
constraints:
  velocity:
    forward: 2.0
    right: 1.0
    down: 0.0
  rate:
    yaw: 35.0
  altitude:
    min: 5.0
    max: 120.0
continuity_policy:
  mode: bounded_decay
  max_coast_time_s: 8.0
  max_coast_distance_m: 4.0
target:
  waypoints:
    - time_s: 0.0
      position_ned: [15.0, -5.0, 0.0]
    - time_s: 4.0
      position_ned: [18.0, 5.0, 0.0]
    - time_s: 8.0
      position_ned: [12.0, 0.0, 0.0]
faults:
  - at_s: 3.0
    kind: target_loss
    duration_s: 1.0
expectations:
  - this profile uses its existing 2D chase semantics
  - it does not advertise Vector-only session controls
  - altitude-disabled commands never contain a down component
