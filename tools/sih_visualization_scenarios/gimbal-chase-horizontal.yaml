schema_version: 1
name: gimbal-velocity-chase-horizontal-moving-target
rate_hz: 20
frame: local_ned
mount_type: HORIZONTAL
airframe: multicopter
evidence_provenance: synthetic_fixture
stable_flight: {required: true, settle_samples: 7}
initial_conditions:
  vehicle_ned: [0.0, 0.0, -20.0]
follower:
  profile: gm_velocity_chase
  purpose: Gimbal-angle velocity chase
  input_contract: gimbal_angles
  command_contract: gimbal_velocity_body
  speed_source_policy: none
  altitude_control: false
  requested_speed: 4.0
constraints:
  velocity: {forward: 4.0, right: 2.0, down: 0.0}
  rate: {yaw: 45.0}
  altitude: {min: 5.0, max: 120.0}
continuity_policy: {mode: bounded_decay, max_coast_time_s: 8.0, max_coast_distance_m: 4.0}
target:
  waypoints:
    - {time_s: 0.0, position_ned: [18.0, -4.0, -20.0]}
    - {time_s: 5.0, position_ned: [22.0, 6.0, -20.0]}
    - {time_s: 10.0, position_ned: [16.0, -6.0, -20.0]}
faults:
  - {at_s: 5.0, kind: delayed_observation, duration_s: 0.3}
expectations:
  - fresh gimbal angles produce body-FRD velocity and yaw intent
  - altitude-disabled guidance keeps body-down at zero
acceptance:
  - stable PX4 pose is required before following evidence
