GStreamerPipelines:
  USB_YUYV: v4l2src device=/dev/video{device_id} ! video/x-raw,format=YUY2,width={width},height={height},framerate={fps}/1
    ! videoconvert ! video/x-raw,format=BGR ! appsink drop=true max-buffers=1 sync=false
  USB_MJPEG: v4l2src device=/dev/video{device_id} ! image/jpeg,width={width},height={height},framerate={fps}/1
    ! jpegdec ! videoconvert ! video/x-raw,format=BGR ! appsink drop=true max-buffers=1
    sync=false
  CSI_NVIDIA: nvarguscamerasrc sensor-id={sensor_id} ! video/x-raw(memory:NVMM),width={width},height={height},format=NV12,framerate={fps}/1
    ! nvvidconv ! video/x-raw,format=BGRx ! videoconvert ! video/x-raw,format=BGR
    ! appsink drop=true sync=false
  CSI_RPI: libcamerasrc ! video/x-raw,format=NV12,width={width},height={height},framerate={fps}/1
    ! videoconvert ! video/x-raw,format=BGR ! appsink drop=true sync=false
  RTSP: rtspsrc location={url} latency={latency} ! decodebin ! videoconvert ! video/x-raw,format=BGR
    ! videoscale ! video/x-raw,width={width},height={height} ! appsink drop=true sync=false
  UDP: udpsrc uri={url} caps="application/x-rtp,media=video,encoding-name=H264,payload=96,clock-rate=90000"
    ! rtph264depay ! h264parse ! avdec_h264 ! videoconvert ! video/x-raw,format=BGR
    ! videoscale ! video/x-raw,width={width},height={height} ! appsink drop=true max-buffers=1
    sync=false
  HTTP: souphttpsrc location={url} ! decodebin ! videoconvert ! video/x-raw,format=BGR
    ! videoscale ! video/x-raw,width={width},height={height} ! appsink drop=true sync=false
